{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Assign Fees</h2>
    <p class="text-gray-500">Allocate fee structures to individual students</p>
</div>

<form method="POST" action="{% url 'assign_fees' %}" class="bg-white rounded-lg shadow-sm border border-gray-200 p-8 mb-8" autocomplete="off">
    {% csrf_token %}
    
    <!-- Top Filters -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Student <span class="text-red-500">*</span></label>
            <select name="student_id" required class="w-full border border-gray-300 rounded-md px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <option value="">-- Select Student --</option>
                {% for student in students %}
                <option value="{{ student.user_id }}">{{ student.display_name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Course <span class="text-red-500">*</span></label>
            <select name="course_id" required class="w-full border border-gray-300 rounded-md px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <option value="">-- Select Course --</option>
                {% for course in courses %}
                <option value="{{ course.course_id }}">{{ course.course_name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Batch <span class="text-red-500">*</span></label>
            <select name="batch_id" required class="w-full border border-gray-300 rounded-md px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <option value="">-- Select Batch --</option>
                {% for batch in batches %}
                <option value="{{ batch.batch_id }}">{{ batch.batch_name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Assign Date <span class="text-red-500">*</span></label>
            <input type="date" name="assign_date" required class="w-full border border-gray-300 rounded-md px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
    </div>
    
    <!-- Fee Details Table -->
    <h3 class="text-lg font-bold text-gray-800 mb-4">Fee Details</h3>
    <div class="border border-gray-200 rounded-lg overflow-hidden mb-8">
        <div class="overflow-x-auto w-full">

        <table class="min-w-full bg-white">
            <thead class="bg-gray-50 border-b border-gray-200">
                <tr>
                    <th class="py-3 px-6 text-left text-xs font-bold text-gray-600 uppercase tracking-wider">Fee Type</th>
                    <th class="py-3 px-6 text-right text-xs font-bold text-gray-600 uppercase tracking-wider w-1/5">Amount (₹)</th>
                    <th class="py-3 px-6 text-right text-xs font-bold text-gray-600 uppercase tracking-wider w-1/5">Discount (₹)</th>
                    <th class="py-3 px-6 text-right text-xs font-bold text-gray-600 uppercase tracking-wider w-1/5">Total (₹)</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 text-sm">
                <!-- Registration Fee -->
                <tr>
                    <td class="py-3 px-6 text-gray-700 font-medium">Registration Fee</td>
                    <td class="py-3 px-6 text-right"><input type="number" step="0.01" value="0.00" class="fee-amt w-full text-right outline-none text-gray-700 bg-transparent border-b border-gray-300 focus:border-indigo-500 px-1 py-0.5"></td>
                    <td class="py-3 px-6 text-right"><input type="number" step="0.01" value="0.00" class="fee-disc w-full text-right border border-gray-300 rounded px-2 py-1 outline-none focus:ring-1 focus:ring-indigo-500 text-gray-700 bg-white"></td>
                    <td class="py-3 px-6 text-right font-medium text-gray-800 fee-total">0.00</td>
                </tr>
                <!-- Course Fee -->
                <tr>
                    <td class="py-3 px-6 text-gray-700 font-medium">Course Fee</td>
                    <td class="py-3 px-6 text-right"><input type="number" step="0.01" value="0.00" class="fee-amt w-full text-right outline-none text-gray-700 bg-transparent border-b border-gray-300 focus:border-indigo-500 px-1 py-0.5"></td>
                    <td class="py-3 px-6 text-right"><input type="number" step="0.01" value="0.00" class="fee-disc w-full text-right border border-gray-300 rounded px-2 py-1 outline-none focus:ring-1 focus:ring-indigo-500 text-gray-700 bg-white"></td>
                    <td class="py-3 px-6 text-right font-medium text-gray-800 fee-total">0.00</td>
                </tr>
                <!-- Material Fee -->
                <tr>
                    <td class="py-3 px-6 text-gray-700 font-medium">Material Fee</td>
                    <td class="py-3 px-6 text-right"><input type="number" step="0.01" value="0.00" class="fee-amt w-full text-right outline-none text-gray-700 bg-transparent border-b border-gray-300 focus:border-indigo-500 px-1 py-0.5"></td>
                    <td class="py-3 px-6 text-right"><input type="number" step="0.01" value="0.00" class="fee-disc w-full text-right border border-gray-300 rounded px-2 py-1 outline-none focus:ring-1 focus:ring-indigo-500 text-gray-700 bg-white"></td>
                    <td class="py-3 px-6 text-right font-medium text-gray-800 fee-total">0.00</td>
                </tr>
            </tbody>
            <tfoot class="bg-gray-50 border-t border-gray-200 font-bold">
                <tr>
                    <td class="py-4 px-6 text-gray-800 text-right uppercase tracking-wider text-xs">Total Amount</td>
                    <td class="py-4 px-6 text-right text-gray-800" id="grand_amount">0.00</td>
                    <td class="py-4 px-6 text-right text-green-600" id="grand_discount">0.00</td>
                    <td class="py-4 px-6 text-right text-indigo-700 text-lg" id="grand_total">0.00</td>
                </tr>
            </tfoot>
        </table>

   </div> </div>
    
    <!-- Bottom Row & Submit -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 items-end">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Due Date <span class="text-red-500">*</span></label>
            <input type="date" name="due_date" required class="w-full border border-gray-300 rounded-md px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </div>
        <div class="lg:col-span-2">
            <label class="block text-sm font-medium text-gray-700 mb-1">Remarks</label>
            <input type="text" name="remarks" class="w-full border border-gray-300 rounded-md px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500 text-sm" placeholder="Enter remarks (optional)">
        </div>
        <div class="text-right">
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-6 rounded-md transition shadow-md">
                Assign Fees
            </button>
        </div>
    </div>
</form>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const assignInput = document.querySelector('input[name="assign_date"]');
        if (assignInput) assignInput.valueAsDate = new Date();

        function recalculate() {
            let grandAmt = 0;
            let grandDisc = 0;
            let grandTot = 0;

            const rows = document.querySelectorAll('tbody tr');
            rows.forEach(function(row) {
                const amtInput = row.querySelector('.fee-amt');
                const discInput = row.querySelector('.fee-disc');
                const totalCell = row.querySelector('.fee-total');

                if (amtInput && discInput && totalCell) {
                    const amt = parseFloat(amtInput.value) || 0;
                    const disc = parseFloat(discInput.value) || 0;
                    const tot = Math.max(0, amt - disc);

                    totalCell.textContent = tot.toFixed(2);
                    grandAmt += amt;
                    grandDisc += disc;
                    grandTot += tot;
                }
            });

            const elAmt = document.getElementById('grand_amount');
            const elDisc = document.getElementById('grand_discount');
            const elTot = document.getElementById('grand_total');

            if (elAmt) elAmt.textContent = grandAmt.toFixed(2);
            if (elDisc) elDisc.textContent = grandDisc.toFixed(2);
            if (elTot) elTot.textContent = grandTot.toFixed(2);
        }

        document.querySelectorAll('.fee-amt, .fee-disc').forEach(function(input) {
            input.addEventListener('input', recalculate);
        });
    });
</script>
{% endblock %}
