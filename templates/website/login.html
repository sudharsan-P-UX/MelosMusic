<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Melo's Music</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #e0e5ec;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .neumorphic-circle {
            background-color: #e0e5ec;
            border-radius: 50%;
            width: 480px;
            height: 480px;
            box-shadow: 15px 15px 35px #a3b1c6, -15px -15px 35px #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }
        .neumorphic-input {
            width: 100%;
            background-color: #e0e5ec;
            border: none;
            border-radius: 20px;
            padding: 14px 14px 14px 45px;
            box-shadow: inset 5px 5px 10px #a3b1c6, inset -5px -5px 10px #ffffff;
            color: #4a5568;
            outline: none;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .neumorphic-input::placeholder {
            color: #a0aec0;
        }
        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 1rem;
        }
        .neumorphic-button {
            width: 100%;
            background-color: #e0e5ec;
            border: none;
            border-radius: 20px;
            padding: 14px;
            font-weight: 700;
            color: #4a5568;
            box-shadow: 6px 6px 12px #a3b1c6, -6px -6px 12px #ffffff;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        .neumorphic-button:active {
            box-shadow: inset 4px 4px 8px #a3b1c6, inset -4px -4px 8px #ffffff;
        }
        .neumorphic-toggle-bg {
            width: 36px;
            height: 18px;
            background-color: #e0e5ec;
            border-radius: 10px;
            box-shadow: inset 3px 3px 6px #a3b1c6, inset -3px -3px 6px #ffffff;
            position: relative;
            cursor: pointer;
        }
        .neumorphic-toggle-knob {
            width: 12px;
            height: 12px;
            background-color: #e53e3e;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 20px; /* active state */
            box-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="neumorphic-circle">
        <h1 class="text-4xl font-extrabold text-gray-700 mb-2 mt-4" style="letter-spacing: -1px;">Login</h1>
        <p class="text-xs text-gray-500 mb-8 font-semibold">Sign in to your account</p>

        <form method="POST" action="" class="w-full max-w-xs flex flex-col space-y-6">
            {% csrf_token %}
            
            {% if error %}
            <div class="text-red-500 text-xs font-bold text-center bg-red-100 rounded p-2">
                {{ error }}
            </div>
            {% endif %}
            
            <div class="relative w-full">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" name="username" placeholder="Username" class="neumorphic-input">
            </div>

            <div class="relative w-full">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" name="password" id="passwordInput" placeholder="Password" class="neumorphic-input pr-10">
                <i class="fa-solid fa-eye absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-gray-400 hover:text-gray-600" id="togglePassword"></i>
            </div>

            <div class="flex justify-between items-center text-[11px] text-gray-500 font-bold px-1">
                <div class="flex items-center space-x-2">
                    <div class="neumorphic-toggle-bg">
                        <div class="neumorphic-toggle-knob"></div>
                    </div>
                    <span>Remember me</span>
                </div>
                <a href="#" class="hover:text-gray-700">Forgot password?</a>
            </div>

            <button type="submit" class="neumorphic-button tracking-wider">SIGN IN</button>
        </form>

        <p class="text-[11px] text-gray-500 mt-6 font-bold mb-4">
            Don't have an account? <a href="#" class="text-red-700 font-extrabold hover:underline">Sign up</a>
        </p>
    </div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#passwordInput');

        togglePassword.addEventListener('click', function (e) {
            // toggle the type attribute
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            // toggle the eye slash icon
            this.classList.toggle('fa-eye-slash');
            this.classList.toggle('fa-eye');
        });
    </script>
</body>
</html>
